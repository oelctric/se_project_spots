<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spots</title>
    <meta
      name="description"
      content="Spots is a responsive photo-sharing profile page that showcases memorable places and a curated gallery of images."
    />
    <meta name="author" content="Omar" />
    <meta
      name="keywords"
      content="Spots, profile page, photo gallery, responsive design, HTML, CSS"
    />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="images/logo.svg" alt="Spots Logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile">
          <div class="profile__avatar-wrapper">
            <img
              src="images/avatar.jpg"
              alt="Omar's Avatar"
              class="profile__avatar"
            />
            <button
              class="profile__avatar-edit-button"
              type="button"
              aria-label="Edit avatar"
            >
              <img
                src="images/pencil.svg"
                alt=""
                class="profile__avatar-edit-icon"
              />
              <span class="profile__avatar-edit-label">Edit Avatar</span>
            </button>
          </div>
          <div class="profile__info">
            <h1 class="profile__name">Omar's Gallery</h1>
            <p class="profile__description">
              Welcome to my collection of favorite spots. I'm a photographer who
              loves capturing the essence of travel and architecture.
            </p>
            <button
              class="profile__edit-button"
              type="button"
              aria-label="Edit Profile"
            >
              <img
                src="images/pencil.svg"
                alt=""
                class="profile__edit-icon"
              />
              Edit Profile
            </button>
          </div>
          <button
            class="profile__new-post-button"
            type="button"
            aria-label="New Post"
          >
            <img src="images/plus.svg" alt="" class="profile__new-post-icon" />
            New Post
          </button>
        </section>
        <section class="cards">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <template id="card-template">
        <li class="card">
          <img src="#" alt="" class="card__img" />
          <div class="card__info">
            <p class="card__caption"></p>
            <button class="card__like-button" type="button" aria-label="Like Spot">
              <img src="images/like.svg" alt="" class="card__like-icon" />
              <img src="images/like-active.svg" alt="" class="card__like-icon" />
            </button>
            <button class="card__delete-button" type="button" aria-label="Delete Spot">
              <img src="images/trash.svg" alt="" class="card__delete-icon" />
              <img src="images/trash-hover.svg" alt="" class="card__delete-icon card__delete-icon_hover" />
            </button>
          </div>
        </li>
      </template>
      <footer class="footer">
        <p class="footer__copyright">&copy; 2026 Spots Gallery</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button
            class="modal__close-button"
            type="button"
            aria-label="Close"
          >
            <img src="images/close.svg" alt="" class="modal__close-icon" />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form" name="edit-profile" novalidate>
            <label class="modal__field">
              <span class="modal__label">Name</span>
              <input
                type="text"
                name="name"
                id="name-input"
                class="modal__input"
                placeholder="Type your name"
                required
                minlength="2"
                maxlength="40"
              />
              <span class="modal__error" id="name-input-error"></span>
            </label>
            <label class="modal__field">
              <span class="modal__label">Description</span>
              <input
                type="text"
                name="description"
                id="description-input"
                class="modal__input"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200"
              />
              <span class="modal__error" id="description-input-error"></span>
            </label>
            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button
            class="modal__close-button"
            type="button"
            aria-label="Close"
          >
            <img src="images/close.svg" alt="" class="modal__close-icon" />
          </button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form" name="new-post" novalidate>
            <label class="modal__field">
              <span class="modal__label">Image link</span>
              <input
                type="url"
                name="link"
                id="link-input"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span class="modal__error" id="link-input-error"></span>
            </label>
            <label class="modal__field">
              <span class="modal__label">Caption</span>
              <input
                type="text"
                name="caption"
                id="caption-input"
                class="modal__input"
                placeholder="Type your caption"
                required
                minlength="2"
                maxlength="30"
              />
              <span class="modal__error" id="caption-input-error"></span>
            </label>
            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="delete-confirm-modal">
        <div class="modal__container modal__container--confirm">
          <button
            class="modal__close-button"
            type="button"
            aria-label="Close"
          >
            <img src="images/close.svg" alt="" class="modal__close-icon" />
          </button>
          <h2 class="modal__title">Are you sure you want to delete this image?</h2>
          <form class="modal__form modal__form--confirm" name="delete-confirm" novalidate>
            <button type="submit" class="modal__save-button modal__save-button_danger">Delete</button>
            <button type="button" class="modal__cancel-button">Cancel</button>
          </form>
        </div>
      </div>
      <div class="modal" id="edit-avatar-modal">
        <div class="modal__container">
          <button
            class="modal__close-button"
            type="button"
            aria-label="Close"
          >
            <img src="images/close.svg" alt="" class="modal__close-icon" />
          </button>
          <h2 class="modal__title">Edit profile avatar</h2>
          <form class="modal__form" name="edit-avatar" novalidate>
            <label class="modal__field">
              <span class="modal__label">Profile Picture</span>
              <input
                type="url"
                name="avatar"
                id="avatar-input"
                class="modal__input"
                placeholder="Paste the link to an image"
                required
              />
              <span class="modal__error" id="avatar-input-error"></span>
            </label>
            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="preview-modal">
        <div class="modal__container modal__container--preview">
          <img src="#" alt="" class="modal__preview-image" />
          <button
            class="modal__close-button"
            type="button"
            aria-label="Close"
          >
            <img src="images/close-preview.svg" alt="" class="modal__close-icon" />
          </button>
          <div class="modal__preview-caption">
            <span class="modal__preview-title"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
